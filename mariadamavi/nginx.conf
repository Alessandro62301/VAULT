server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/snippets/mariadamavi-security.conf;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Arquivos do Vite têm hash no nome: cache longo
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ^~ /optimized/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|avif|svg|mp4|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }
}
