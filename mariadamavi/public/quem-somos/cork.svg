<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Cortiça: base caramelo + grânulos escuros e claros de ruído procedural -->
  <filter id="dark" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.22  0 0 0 0 0.11  0 0 0 -9 5.1"/>
  </filter>
  <filter id="light" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="21" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.93  0 0 0 0 0.78  0 0 0 0 0.56  0 0 0 9 -5.2"/>
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0625" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.28  0 0 0 0 0.14  0 0 0 0.9 -0.2"/>
  </filter>
  <rect width="320" height="320" fill="#c18e5c"/>
  <rect width="320" height="320" filter="url(#mottle)" opacity="0.28"/>
  <rect width="320" height="320" filter="url(#dark)" opacity="0.85"/>
  <rect width="320" height="320" filter="url(#light)" opacity="0.7"/>
</svg>
