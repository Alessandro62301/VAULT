<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160">
  <!-- Madeira: veios esticados na horizontal -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.18" numOctaves="4" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.24  0 0 0 0 0.13  0 0 0 0 0.06  0 0 0 2.2 -0.7"/>
  </filter>
  <rect width="600" height="160" fill="#7a4a26"/>
  <rect width="600" height="160" filter="url(#grain)"/>
</svg>
