# Merge into the existing HTTPS server for mariadamavi.com.br.
# Keep its current listen, certificate, root and other sites unchanged.
# Copy the security-headers.conf generated by THIS build to the path below.
include /etc/nginx/snippets/mariadamavi-security.conf;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
# Optional, if ngx_http_gzip_static_module is enabled: gzip_static on;

# Only content-hashed files receive a year of cache. HTML must revalidate.
# Merge with equivalent existing locations instead of declaring them twice.
location ^~ /assets/ {
    expires 1y;
    try_files $uri =404;
}
location ^~ /optimized/ {
    expires 1y;
    try_files $uri =404;
}
location ~* \.(?:webp|avif|png|jpe?g|svg|mp4|woff2?)$ {
    expires 7d;
    try_files $uri =404;
}
location ~* \.html$ {
    expires -1;
    try_files $uri =404;
}
location / {
    expires -1;
    try_files $uri $uri/ =404;
}
